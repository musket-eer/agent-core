version: '3.8'

services:
  agent-core:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DEEPSEEK_URL=${DEEPSEEK_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SUPABASE_URL=${SUPABASE_API_URL}
      - SUPABASE_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ${PWD}/internal/llm/configs:/root/internal/llm/configs
      - ${PWD}/configs/prompts:/app/configs/prompts
      - ${PWD}/.env:/.env
    restart: unless-stopped
